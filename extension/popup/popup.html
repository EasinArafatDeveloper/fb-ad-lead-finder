<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header><b>FB Ad Lead Finder</b><span id="dot" class="dot"></span></header>

  <section id="stats" class="stats"></section>
  <div id="state" class="state"></div>

  <button id="connect" class="primary connect">Connect with your account</button>
  <p class="hint">Opens the dashboard — log in and press "Connect this computer". No key to copy.</p>

  <details class="team-only">
    <summary>Advanced: server and key</summary>
    <label>Server URL <input id="serverUrl" placeholder="http://localhost:3002" /></label>
    <label>Extension key <input id="apiKey" type="password" placeholder="ext_… from the dashboard (or the team's worker key)" /></label>
  </details>
  <label class="check team-only"><input id="enabled" type="checkbox" /> Run the worker in this browser</label>

  <div class="actions">
    <button id="save" class="team-only">Save &amp; Connect</button>
    <button id="open" class="primary">Open Dashboard</button>
  </div>
  <p id="msg" class="msg"></p>
  <script src="popup.js"></script>
</body>
</html>
