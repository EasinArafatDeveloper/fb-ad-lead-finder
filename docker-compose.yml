# FB Ad Lead Finder on the home server (see ~/server/PROJECTS.md)
# - dashboard + API on 127.0.0.1:3002 (this PC only); public through Cloudflare Tunnel as http://fb-leads:4000
# - database: its own database + user on the shared MongoDB container ('db' network, host 'mongodb')
# - secrets in ./.env (chmod 600, never committed)
services:
  app:
    build: .
    container_name: fb-leads
    env_file: ./.env
    environment:
      TZ: Asia/Dhaka
      PORT: 4000
      # room for very big sheets (a workbook is unpacked in memory while it is opened or saved)
      NODE_OPTIONS: --max-old-space-size=2048
    ports: ["127.0.0.1:3002:4000"]
    restart: unless-stopped
    networks: [db, proxy]
    mem_limit: 3g
    cpus: 1.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  db:
    external: true
  proxy:
    external: true
